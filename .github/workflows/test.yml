name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: pytest unit + integration (SQLite, no real Clerk/Gemini)
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            logic/requirements.txt
            logic/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          CLERK_JWKS_URL: https://test.clerk.dev/.well-known/jwks.json
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          CLERK_JWKS_URL: https://test.clerk.dev/.well-known/jwks.json
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Coverage report
        run: |
          python -m pytest tests/unit/ tests/integration/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60
        env:
          DATABASE_URL: sqlite:///./test.db
          CLERK_JWKS_URL: https://test.clerk.dev/.well-known/jwks.json
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: logic/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # Frontend: Vitest unit + integration
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: view

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (unit + integration)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: view/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # E2E: Playwright (runs after unit tests pass)
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: view

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend for E2E
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          # Set a placeholder — Clerk won't be configured in CI for E2E
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Run E2E tests against preview server
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: view/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Smoke: HTTP probes against live deployments (main only)
  # ─────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx + pytest
        run: pip install httpx pytest

      - name: Wait for Render to finish deploying
        run: sleep 90

      - name: Run backend smoke tests
        run: python -m pytest logic/tests/smoke/ -v -m smoke
        env:
          TARGET_URL: ${{ secrets.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.CLOUDFLARE_FRONTEND_URL }}
